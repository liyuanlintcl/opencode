name: Build CLI Windows

on:
  push:
    branches: [cli]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install project dependencies
        run: bun install

      - name: Build CLI
        run: |
          cd packages/opencode
          bun run build --single

      - name: Verify build output
        run: |
          Get-ChildItem -Path packages/opencode/dist/opencode-windows-x64/bin/ -Recurse

      - name: Stage artifact for upload
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item packages/opencode/dist/opencode-windows-x64/bin/opencode.exe artifact/opencode.exe

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-windows
          path: artifact/opencode.exe
          if-no-files-found: error
